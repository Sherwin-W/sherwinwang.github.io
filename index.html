<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0d12" />
    <script>try{var t=localStorage.getItem('theme');if(t==='light'||t==='dark'){document.documentElement.dataset.theme=t;document.querySelector('meta[name="theme-color"]').content=t==='light'?'#e3e7ef':'#0b0d12'}}catch{}if(location.pathname==='/'||location.pathname==='/index.html')document.documentElement.dataset.boot='home';</script>
    <style>html[data-boot="home"],html[data-boot="home"] body{background:#0b0d12}html[data-boot="home"][data-theme="light"],html[data-boot="home"][data-theme="light"] body{background:#e3e7ef}@media(prefers-color-scheme:light){html[data-boot="home"]:not([data-theme="dark"]),html[data-boot="home"]:not([data-theme="dark"]) body{background:#e3e7ef}}</style>
    <meta name="description" content="Sherwin Wang - computer science student and portfolio of projects." />
    <title>Sherwin Wang - Portfolio</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="%BASE_URL%src/main.jsx"></script>
  </body>
</html>
